[package]
name = "sh1n-vpn"
version = "0.2.0-beta.1"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Security",
  "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
  "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory",
  "Win32_System_SystemServices", "Win32_System_Threading",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
